<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Dante Propiedades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .contacts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .contacts-table th,
        .contacts-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .contacts-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }
        
        .contacts-table tr:hover {
            background-color: #f5f5f5;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .refresh-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Panel de Administración</h1>
            <p>Dante Propiedades - Sistema de Contactos</p>
        </div>
        
        <div class="panel">
            <div class="stats-grid" id="statsGrid">
                <div class="loading">Cargando estadísticas...</div>
            </div>
            
            <div class="actions">
                <button class="btn btn-primary" onclick="cargarDatos()">
                    🔄 Actualizar Datos
                </button>
                <a href="https://danterealestate-github-io.onrender.com/api/descargar-excel" class="btn btn-success" download>
                    📥 Descargar Excel
                </a>
                <button class="btn refresh-btn" onclick="verificarConexion()">
                    🔍 Verificar Servidor
                </button>
            </div>
            
            <div id="status"></div>
        </div>
        
        <div class="panel">
            <h2>📋 Lista de Contactos</h2>
            <div id="contactsContainer">
                <div class="loading">Cargando contactos...</div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'https://danterealestate-github-io.onrender.com';
        
        async function verificarConexion() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="loading">Verificando conexión...</div>';
            
            try {
                const response = await fetch(`${SERVER_URL}/health`);
                const data = await response.json();
                
                if (response.ok && data.status === 'OK') {
                    statusDiv.innerHTML = `
                        <div class="success">
                            ✅ Servidor funcionando correctamente<br>
                            📅 Última verificación: ${new Date(data.timestamp).toLocaleString('es-AR')}
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div class="error">
                            ❌ Problema con el servidor: ${data.message || 'Error desconocido'}
                        </div>
                    `;
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="error">
                        ❌ Error de conexión: ${error.message}
                    </div>
                `;
            }
        }
        
        async function cargarDatos() {
            const statsGrid = document.getElementById('statsGrid');
            const contactsContainer = document.getElementById('contactsContainer');
            
            // Cargar estadísticas
            try {
                const response = await fetch(`${SERVER_URL}/api/estadisticas`);
                const data = await response.json();
                
                if (response.ok) {
                    statsGrid.innerHTML = `
                        <div class="stat-card">
                            <h3>${data.total_contactos || 0}</h3>
                            <p>📊 Total Contactos</p>
                        </div>
                        <div class="stat-card">
                            <h3>${data.contactos_hoy || 0}</h3>
                            <p>📅 Hoy</p>
                        </div>
                        <div class="stat-card">
                            <h3>${data.ultimo_contacto || 'N/A'}</h3>
                            <p>🕒 Último</p>
                        </div>
                        <div class="stat-card">
                            <h3>${data.formularios_recibidos || 0}</h3>
                            <p>📝 Formularios</p>
                        </div>
                    `;
                } else {
                    statsGrid.innerHTML = '<div class="error">Error cargando estadísticas</div>';
                }
            } catch (error) {
                statsGrid.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
            
            // Cargar contactos
            cargarContactos();
        }
        
        async function cargarContactos() {
            const contactsContainer = document.getElementById('contactsContainer');
            contactsContainer.innerHTML = '<div class="loading">Cargando contactos...</div>';
            
            try {
                const response = await fetch(`${SERVER_URL}/api/guardar-contacto`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.contactos && data.contactos.length > 0) {
                    let tableHTML = `
                        <table class="contacts-table">
                            <thead>
                                <tr>
                                    <th>📅 Fecha</th>
                                    <th>👤 Nombre</th>
                                    <th>📧 Email</th>
                                    <th>📱 Teléfono</th>
                                    <th>💬 Mensaje</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.contactos.forEach(contacto => {
                        tableHTML += `
                            <tr>
                                <td>${new Date(contacto.fecha).toLocaleString('es-AR')}</td>
                                <td>${contacto.nombre || 'N/A'}</td>
                                <td>${contacto.email || 'N/A'}</td>
                                <td>${contacto.telefono || 'N/A'}</td>
                                <td>${(contacto.mensaje || '').substring(0, 100)}...</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += `
                            </tbody>
                        </table>
                    `;
                    
                    contactsContainer.innerHTML = tableHTML;
                } else {
                    contactsContainer.innerHTML = '<p>📭 No hay contactos registrados aún.</p>';
                }
            } catch (error) {
                contactsContainer.innerHTML = `<div class="error">Error cargando contactos: ${error.message}</div>`;
            }
        }
        
        // Verificar conexión al cargar la página
        window.addEventListener('load', () => {
            verificarConexion();
            cargarDatos();
        });
        
        // Actualizar cada 30 segundos
        setInterval(() => {
            cargarDatos();
        }, 30000);
    </script>
</body>
</html>
