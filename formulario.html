<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Dante Propiedades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #232deb 0%, #1a1db4 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(35, 45, 235, 0.3);
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .logo-key {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .logo-key img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin: 20px 0;
        }
        
        .form-section h2 {
            color: #232deb;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .google-form-container {
            width: 100%;
            min-height: 600px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .back-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 24px;
            background: #232deb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: #1a1db4;
            transform: translateY(-2px);
        }
        
        /* WHATSAPP FLOTANTE */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 30px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        
        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .contact-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .contact-card h3 {
            color: #232deb;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <span class="logo-key">
                <img src="llave.png" alt="Logo Dante Propiedades">
            </span>
            Dante Propiedades
            <span style="font-size: 0.6em; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px;">📞 +54 11 4567-8900</span>
        </h1>
    </div>
    
    <div class="container">
        <a href="index.html" class="back-btn">← Volver al Inicio</a>
        
        <div class="form-section">
            <h2>📋 Formulario de Contacto</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #666;">
                Completa el formulario y nos pondremos en contacto contigo a la brevedad
            </p>
            
            <!-- Google Form Embed - Reemplaza con tu enlace de Google Forms -->
            <iframe 
                class="google-form-container" 
                src="https://docs.google.com/forms/d/e/1FAIpQLSfY3J5FJXoGVZYw5dKVGaHg8L8GFMlVr8yJoE7vV9VKCJW6A/viewform?embedded=true" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
                Cargando formulario...
            </iframe>
        </div>
        
        <div class="contact-info">
            <div class="contact-card">
                <h3>📞 Teléfono</h3>
                <p>+54 11 4567-8900</p>
                <p style="font-size: 0.9em; color: #666;">Lunes a Viernes 9:00 - 18:00</p>
            </div>
            <div class="contact-card">
                <h3>📧 Email</h3>
                <p><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="9af3f4fcf5dafefbf4eeffeae8f5eaf3fffefbfeffe9b4f9f5f7b4fbe8">[email&#160;protected]</a></p>
            </div>
            <div class="contact-card">
                <h3>📍 Dirección</h3>
                <p>Capital Federal, Argentina</p>
            </div>
        </div>
    </div>
    
    <!-- WhatsApp Flotante -->
    <a href="https://wa.me/5491145678900?text=Hola,%20me%20interesa%20obtener%20información%20sobre%20propiedades" 
       class="whatsapp-float" 
       target="_blank" 
       title="Contactar por WhatsApp">
        💬
    </a>
    
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script></body>
</html>
