<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Galería con Múltiples Imágenes</title>
    <link rel="icon" href="llave.png" type="image/png">
    <style>
        /* RESET Y BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; color:#333; line-height:1.6; }
        /* HEADER */
        .header { background: linear-gradient(135deg, #232deb 0%, #1a1db4 100%); color:white; padding:26px 20px; text-align:center; box-shadow:0 4px 20px rgba(35,45,235,0.3); display:flex; flex-direction:column; align-items:center; gap:8px; }
        .header .company-info { display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
        .header .logo-key { width:45px; height:45px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .header .logo-key img { width:100%; height:100%; object-fit:contain; }
        .header h1 { font-size:2.2em; margin-bottom:8px; font-weight:700; }
        .header .phone { font-size:0.4em; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px; font-weight:500; }
        .ai-header-button { display:inline-flex; align-items:center; gap:8px; margin-top:12px; padding:10px 16px; border:1px solid rgba(255,255,255,0.35); border-radius:6px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; cursor:pointer; font-size:14px; font-weight:600; transition:transform .3s ease, box-shadow .3s ease; }
        .ai-header-button:hover { transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,0.25); }
        .ai-header-button svg { width:20px; height:20px; }
        /* CHAT MODAL */
        .chat-modal { position:fixed; bottom:20px; right:20px; width:350px; max-width:90vw; height:450px; background:#fff; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.15); display:none; flex-direction:column; overflow:hidden; z-index:1000; }
        .chat-header { padding:15px; background:#007bff; color:#fff; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
        .chat-body { flex:1; padding:15px; overflow-y:auto; background:#f8f9fa; display:flex; flex-direction:column; gap:10px; }
        .chat-input { padding:10px 15px; background:#fff; border-top:1px solid #e9ecef; display:flex; gap:10px; }
        .chat-input input { flex:1; padding:8px 12px; border:1px solid #ced4da; border-radius:20px; outline:none; }
        .chat-input button { padding:8px 15px; background:#007bff; color:#fff; border:none; border-radius:20px; cursor:pointer; }
        .chat-input button:hover { background:#0056b3; }
        .message.usuario { color:#232deb; }
        .message.ia { color:#28a745; }
        .message.sistema { color:#dc3545; }
        @media (max-width:768px) { .header { padding:20px 15px; } .header h1 { font-size:1.6em; } .header .phone { font-size:0.35em; padding:5px 10px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="company-info">
            <div class="logo-key"><img src="logo.png" alt="Logo Dante Propiedades"></div>
            <h1>Dante Propiedades</h1>
            <div class="phone">📞 +54 11 7659-6523</div>
        </div>
    </header>

    <!-- Botón para abrir el chat -->
    <button class="ai-header-button" id="open-ia-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 6v6l4 2"/></svg>
        <span>Asistente IA</span>
    </button>

    <!-- Chat modal -->
    <div id="chat-modal" class="chat-modal">
        <div class="chat-header">
            <h3>🤖 Asistente IA</h3>
            <button id="close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-welcome">
            <p>👋 ¡Hola! Soy tu asistente IA Dante. Pregúntame sobre propiedades, filtros o cualquier otra consulta.</p>
        </div>
        <div id="chat-messages" class="chat-body"></div>
        <div class="chat-input">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." />
            <button id="send-chat">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
