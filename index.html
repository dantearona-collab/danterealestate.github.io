<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Modular - Chatbot Inmobiliario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        .bot-message {
            text-align: left;
        }

        .user-message {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .bot-message .message-content {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .user-message .message-content {
            background: #f3e5f5;
            color: #7b1fa2;
            border: 1px solid #ce93d8;
        }

        .properties-stats {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #2e7d32;
        }

        .property-details {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.85rem;
        }

        .property-details h4 {
            color: #ef6c00;
            margin-bottom: 8px;
        }

        .property-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
        }

        .property-field {
            font-size: 0.8rem;
        }

        .property-field strong {
            color: #333;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .typing-indicator {
            font-style: italic;
            color: #666;
            opacity: 0.7;
        }

        .error-message {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .loading-properties {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            color: #1565c0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .navigation-hint {
            background: #f0f4f8;
            border: 1px solid #5c6bc0;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #3f51b5;
        }

        .debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .search-filters {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            color: #495057;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            color: #495057;
            transition: border-color 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: #495057;
            border: 2px solid #e1e5e9;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            border-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🏠 Asistente Inmobiliario</h1>
            <p>Sistema de Navegación Modular</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-icon">👋</div>
                <h3>¡Bienvenido al Sistema Modular!</h3>
                <p>Estoy cargando las propiedades disponibles...</p>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input 
                type="text" 
                id="chatInput" 
                class="chat-input" 
                placeholder="Escribe aquí (usa números: 1, 2, 3, 0)"
                autocomplete="off"
            >
        </div>
    </div>

    <script>
        // Variables globales
        let propiedades = [];
        let propiedadActual = null;
        let propiedadesDisponibles = 0;
        let tiposDisponibles = [];
        let propiedadesCargadas = false;
        let contextoActual = 'principal';
        let historialContexto = [];

        // Clase para el sistema modular de menús
        class SistemaMenus {
            constructor() {
                this.contextoActual = 'principal';
                this.historialContexto = [];
                this.configuracion = {
                    menuPrincipal: {
                        titulo: "Menú Principal",
                        opciones: [
                            { numero: 1, texto: "Búsqueda Avanzada", accion: () => this.navegarA('busqueda') },
                            { numero: 2, texto: "Ver Todas las Propiedades", accion: () => this.mostrarTodasPropiedades() },
                            { numero: 3, texto: "Estadísticas", accion: () => this.mostrarEstadisticas() },
                            { numero: 0, texto: "Salir", accion: () => this.salir() }
                        ]
                    },
                    menuBusqueda: {
                        titulo: "Búsqueda Avanzada",
                        opciones: [
                            { numero: 1, texto: "Buscar por Tipo", accion: () => this.navegarA('tipos') },
                            { numero: 2, texto: "Buscar por Barrio", accion: () => this.navegarA('barrios') },
                            { numero: 3, texto: "Buscar por Precio", accion: () => this.navegarA('precios') },
                            { numero: 0, texto: "Volver al Menú Principal", accion: () => this.volver() }
                        ]
                    },
                    menuTipos: {
                        titulo: "Seleccionar Tipo de Propiedad",
                        opciones: []
                    },
                    menuBarrios: {
                        titulo: "Seleccionar Barrio",
                        opciones: []
                    },
                    menuPrecios: {
                        titulo: "Seleccionar Rango de Precio",
                        opciones: [
                            { numero: 1, texto: "Hasta $500,000 ARS", accion: () => this.filtrarPorPrecio(0, 500000, 'ARS') },
                            { numero: 2, texto: "Desde $500,000 hasta $1,000,000 ARS", accion: () => this.filtrarPorPrecio(500000, 1000000, 'ARS') },
                            { numero: 3, texto: "Desde $1,000,000 ARS en adelante", accion: () => this.filtrarPorPrecio(1000000, Infinity, 'ARS') },
                            { numero: 4, texto: "Hasta $200,000 USD", accion: () => this.filtrarPorPrecio(0, 200000, 'USD') },
                            { numero: 5, texto: "Más de $200,000 USD", accion: () => this.filtrarPorPrecio(200000, Infinity, 'USD') },
                            { numero: 0, texto: "Volver al Menú Principal", accion: () => this.volver() }
                        ]
                    }
                };
                this.reconstruirMenus();
            }

            reconstruirMenus() {
                if (propiedadesCargadas) {
                    this.configuracion.menuTipos.opciones = this.generarOpcionesTipos();
                    this.configuracion.menuBarrios.opciones = this.generarOpcionesBarrios();
                }
            }

            navegarA(nuevoContexto) {
                this.historialContexto.push(this.contextoActual);
                this.contextoActual = nuevoContexto;
                this.mostrarMenu();
            }

            volver() {
                if (this.historialContexto.length > 0) {
                    this.contextoActual = this.historialContexto.pop();
                    this.mostrarMenu();
                } else {
                    this.mostrarMenuPrincipal();
                }
            }

            mostrarMenu() {
                let mensaje = "";
                const menu = this.configuracion[this.contextoActual];
                
                if (menu) {
                    mensaje += `📋 **${menu.titulo}**\n\n`;
                    
                    if (this.contextoActual === 'tipos' && tiposDisponibles.length === 0) {
                        mensaje += "⚠️ No hay tipos de propiedades disponibles.\n";
                    } else if (this.contextoActual === 'barrios' && this.generarOpcionesBarrios().length === 0) {
                        mensaje += "⚠️ No hay barrios disponibles.\n";
                    } else {
                        menu.opciones.forEach(opcion => {
                            mensaje += `${opcion.numero}. ${opcion.texto}\n`;
                        });
                    }
                    
                    if (this.contextoActual !== 'principal') {
                        mensaje += "\n0. Volver\n";
                    }
                    
                    mensaje += `\n📊 Propiedades cargadas: ${propiedadesDisponibles}`;
                } else {
                    mensaje += "⚠️ Menú no encontrado.\n";
                }
                
                this.mostrarMensajeBot(mensaje);
            }

            mostrarMenuPrincipal() {
                this.contextoActual = 'principal';
                this.historialContexto = [];
                this.mostrarMenu();
            }

            procesarOpcion(numero) {
                const menu = this.configuracion[this.contextoActual];
                if (!menu) {
                    this.mostrarMensajeBot("⚠️ Error: Menú no encontrado.");
                    return;
                }

                const opcion = menu.opciones.find(opt => opt.numero === numero);
                if (!opcion) {
                    if (numero === 0) {
                        this.volver();
                    } else {
                        this.mostrarMensajeBot(`⚠️ Opción ${numero} no válida.`);
                    }
                    return;
                }

                opcion.accion();
            }

            generarOpcionesTipos() {
                const tipos = [...new Set(propiedades.map(p => p.tipo))];
                return tipos.map((tipo, index) => ({
                    numero: index + 1,
                    texto: tipo.charAt(0).toUpperCase() + tipo.slice(1),
                    accion: () => this.filtrarPorTipo(tipo)
                }));
            }

            generarOpcionesBarrios() {
                const barrios = [...new Set(propiedades.map(p => p.barrio))];
                return barrios.map((barrio, index) => ({
                    numero: index + 1,
                    texto: barrio,
                    accion: () => this.filtrarPorBarrio(barrio)
                }));
            }

            mostrarTodasPropiedades() {
                if (propiedades.length === 0) {
                    this.mostrarMensajeBot("⚠️ No hay propiedades disponibles.");
                    return;
                }

                let mensaje = `🏠 **TODAS LAS PROPIEDADES DISPONIBLES**\n\n`;
                mensaje += `📊 Total: ${propiedades.length} propiedades\n\n`;
                
                propiedades.forEach((propiedad, index) => {
                    mensaje += `${index + 1}. **${propiedad.titulo}**\n`;
                    mensaje += `   💰 ${propiedad.precio} ${propiedad.moneda_precio}\n`;
                    mensaje += `   📍 ${propiedad.barrio} - ${propiedad.tipo}\n`;
                    mensaje += `   🏷️ ${propiedad.operacion}\n\n`;
                });
                
                mensaje += "Selecciona el número de la propiedad para ver detalles (1-" + propiedades.length + ")";
                mensaje += "\n0. Volver al menú principal";
                
                this.mostrarMensajeBot(mensaje);
                this.contextoActual = 'lista';
                this.propiedadesResultado = propiedades;
            }

            filtrarPorTipo(tipo) {
                const resultados = propiedades.filter(p => p.tipo === tipo);
                this.mostrarResultados(resultados, `Filtrado por tipo: ${tipo}`);
            }

            filtrarPorBarrio(barrio) {
                const resultados = propiedades.filter(p => p.barrio === barrio);
                this.mostrarResultados(resultados, `Filtrado por barrio: ${barrio}`);
            }

            filtrarPorPrecio(min, max, moneda) {
                const resultados = propiedades.filter(p => {
                    return p.moneda_precio === moneda && 
                           p.precio >= min && 
                           (max === Infinity || p.precio <= max);
                });
                this.mostrarResultados(resultados, `Filtrado por precio: ${min} - ${max} ${moneda}`);
            }

            mostrarResultados(resultados, tituloFiltro) {
                if (resultados.length === 0) {
                    this.mostrarMensajeBot(`❌ No se encontraron propiedades para: ${tituloFiltro}`);
                    return;
                }

                let mensaje = `🔍 **${tituloFiltro}**\n\n`;
                mensaje += `📊 Encontradas: ${resultados.length} propiedades\n\n`;
                
                resultados.forEach((propiedad, index) => {
                    mensaje += `${index + 1}. **${propiedad.titulo}**\n`;
                    mensaje += `   💰 ${propiedad.precio} ${propiedad.moneda_precio}\n`;
                    mensaje += `   📍 ${propiedad.barrio} - ${propiedad.tipo}\n\n`;
                });
                
                mensaje += "Selecciona el número de la propiedad para ver detalles (1-" + resultados.length + ")";
                mensaje += "\n0. Volver al menú anterior";
                
                this.mostrarMensajeBot(mensaje);
                this.propiedadesResultado = resultados;
                this.contextoActual = 'resultados';
            }

            mostrarDetallesPropiedad(indice) {
                if (!this.propiedadesResultado || indice < 1 || indice > this.propiedadesResultado.length) {
                    this.mostrarMensajeBot("⚠️ Número de propiedad no válido.");
                    return;
                }

                const propiedad = this.propiedadesResultado[indice - 1];
                let mensaje = `🏠 **DETALLES DE LA PROPIEDAD**\n\n`;
                mensaje += `**${propiedad.titulo}**\n\n`;
                mensaje += `💰 **Precio:** ${propiedad.precio} ${propiedad.moneda_precio}\n`;
                mensaje += `📍 **Ubicación:** ${propiedad.barrio}\n`;
                mensaje += `🏘️ **Tipo:** ${propiedad.tipo}\n`;
                mensaje += `🔧 **Estado:** ${propiedad.estado}\n`;
                mensaje += `🧭 **Orientación:** ${propiedad.orientacion}\n`;
                
                if (propiedad.ambientes > 0) {
                    mensaje += `🛏️ **Ambientes:** ${propiedad.ambientes}\n`;
                }
                
                if (propiedad.metros_cuadrados > 0) {
                    mensaje += `📐 **Metros cuadrados:** ${propiedad.metros_cuadrados} m²\n`;
                }
                
                if (propiedad.expensas > 0) {
                    mensaje += `💳 **Expensas:** ${propiedad.expensas} ${propiedad.moneda_expensas}\n`;
                }
                
                mensaje += `\n📝 **Descripción:**\n${propiedad.descripcion}\n\n`;
                
                mensaje += `**Características:**\n`;
                mensaje += `🅿️ Cochera: ${propiedad.cochera}\n`;
                mensaje += `🌅 Balcón: ${propiedad.balcon}\n`;
                mensaje += `🏊 Pileta: ${propiedad.pileta}\n`;
                mensaje += `🐾 Mascotas: ${propiedad.acepta_mascotas}\n`;
                mensaje += `❄️ Aire Acondicionado: ${propiedad.aire_acondicionado}\n\n`;
                
                if (propiedad.fotos && propiedad.fotos.length > 0) {
                    mensaje += `📷 **Fotos disponibles:** ${propiedad.fotos.length} imágenes\n`;
                }
                
                mensaje += `\n0. Volver a los resultados`;
                
                this.mostrarMensajeBot(mensaje);
                this.contextoActual = 'detalles';
            }

            mostrarEstadisticas() {
                if (propiedades.length === 0) {
                    this.mostrarMensajeBot("⚠️ No hay propiedades cargadas para mostrar estadísticas.");
                    return;
                }

                const tiposCount = {};
                const barriosCount = {};
                const precios = [];
                
                propiedades.forEach(p => {
                    tiposCount[p.tipo] = (tiposCount[p.tipo] || 0) + 1;
                    barriosCount[p.barrio] = (barriosCount[p.barrio] || 0) + 1;
                    precios.push(p.precio);
                });

                let mensaje = `📊 **ESTADÍSTICAS DEL SISTEMA**\n\n`;
                mensaje += `🏠 **Total de propiedades:** ${propiedades.length}\n\n`;
                
                mensaje += `📈 **Por Tipo:**\n`;
                Object.entries(tiposCount).forEach(([tipo, count]) => {
                    mensaje += `• ${tipo}: ${count}\n`;
                });
                
                mensaje += `\n📍 **Por Barrio:**\n`;
                Object.entries(barriosCount).forEach(([barrio, count]) => {
                    mensaje += `• ${barrio}: ${count}\n`;
                });
                
                if (precios.length > 0) {
                    precios.sort((a, b) => a - b);
                    mensaje += `\n💰 **Precios:**\n`;
                    mensaje += `• Menor: ${Math.min(...precios)} USD/ARS\n`;
                    mensaje += `• Mayor: ${Math.max(...precios)} USD/ARS\n`;
                    mensaje += `• Promedio: ${Math.round(precios.reduce((a, b) => a + b, 0) / precios.length)} USD/ARS\n`;
                }
                
                this.mostrarMensajeBot(mensaje);
            }

            salir() {
                this.mostrarMensajeBot("👋 ¡Gracias por usar nuestro sistema! ¡Hasta luego!");
            }

            mostrarMensajeBot(texto) {
                const chatMessages = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                
                const content = document.createElement('div');
                content.className = 'message-content';
                
                // Procesar texto con formato markdown simple
                const formattedText = texto
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                
                content.innerHTML = formattedText;
                messageDiv.appendChild(content);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // Sistema de navegación
        class SistemaNavegacion {
            constructor(sistemaMenus) {
                this.sistemaMenus = sistemaMenus;
                this.input = document.getElementById('chatInput');
                this.chatMessages = document.getElementById('chatMessages');
                this.setupEventListeners();
            }

            setupEventListeners() {
                this.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.procesarInput();
                    }
                });
            }

            procesarInput() {
                const valor = this.input.value.trim();
                if (!valor) return;

                // Mostrar mensaje del usuario
                this.mostrarMensajeUsuario(valor);
                
                // Procesar número
                const numero = parseInt(valor);
                if (isNaN(numero)) {
                    this.mostrarMensajeBot("⚠️ Por favor ingresa un número válido (1, 2, 3, 0).");
                    this.input.value = '';
                    return;
                }

                // Procesar según el contexto actual
                if (this.sistemaMenus.contextoActual === 'resultados' || this.sistemaMenus.contextoActual === 'lista') {
                    if (numero === 0) {
                        this.sistemaMenus.volver();
                    } else {
                        this.sistemaMenus.mostrarDetallesPropiedad(numero);
                    }
                } else if (this.sistemaMenus.contextoActual === 'detalles') {
                    if (numero === 0) {
                        this.sistemaMenus.volver();
                    } else {
                        this.mostrarMensajeBot("⚠️ En detalles solo puedes usar 0 para volver.");
                    }
                } else {
                    this.sistemaMenus.procesarOpcion(numero);
                }

                this.input.value = '';
            }

            mostrarMensajeUsuario(texto) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user-message';
                
                const content = document.createElement('div');
                content.className = 'message-content';
                content.textContent = texto;
                
                messageDiv.appendChild(content);
                this.chatMessages.appendChild(messageDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            mostrarMensajeBot(texto) {
                this.sistemaMenus.mostrarMensajeBot(texto);
            }
        }

        // Función para cargar propiedades desde JSON usando XMLHttpRequest
        function cargarPropiedades() {
            return new Promise((resolve, reject) => {
                console.log('🔄 Cargando propiedades con XMLHttpRequest...');
                
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'propiedades.json', true);
                
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            console.log(`✅ JSON cargado: ${data.length} propiedades`);
                            resolve(data);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                            reject(new Error('Error al parsear el archivo JSON'));
                        }
                    } else {
                        console.error(`Error HTTP: ${xhr.status}`);
                        reject(new Error(`Error HTTP: ${xhr.status}`));
                    }
                };
                
                xhr.onerror = function() {
                    console.error('Error de red al cargar propiedades.json');
                    reject(new Error('Error de red al cargar propiedades'));
                };
                
                xhr.ontimeout = function() {
                    console.error('Timeout al cargar propiedades.json');
                    reject(new Error('Timeout al cargar propiedades'));
                };
                
                xhr.timeout = 10000;
                xhr.send();
            });
        }

        // Función para mostrar loading
        function mostrarLoading() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="loading-properties">
                    <div class="typing-indicator">🔄 Cargando propiedades...</div>
                    <p style="margin-top: 10px; font-size: 0.9rem;">Conectando con la base de datos</p>
                </div>
            `;
        }

        // Sistema global
        let sistemaMenus = null;
        let sistemaNavegacion = null;

        // Función para inicializar el sistema
        async function inicializarSistema() {
            mostrarLoading();
            
            try {
                actualizarDebug("🔄 Cargando propiedades...");
                
                // Cargar propiedades
                propiedades = await cargarPropiedades();
                
                if (!propiedades || propiedades.length === 0) {
                    throw new Error('No se encontraron propiedades en el archivo');
                }
                
                // Configurar variables globales
                propiedadesDisponibles = propiedades.length;
                tiposDisponibles = [...new Set(propiedades.map(p => p.tipo))];
                propiedadesCargadas = true;
                
                // Mostrar mensaje de éxito
                mostrarMensajeBienvenida();
                
                // Inicializar sistemas
                sistemaMenus = new SistemaMenus();
                sistemaNavegacion = new SistemaNavegacion(sistemaMenus);
                
                // Mostrar menú principal
                sistemaMenus.mostrarMenuPrincipal();
                
                actualizarDebug(`✅ ${propiedadesDisponibles} propiedades cargadas`);
                
            } catch (error) {
                console.error('Error al cargar propiedades:', error);
                mostrarErrorCarga(error);
            }
        }

        // Función para mostrar mensaje de bienvenida con estadísticas
        function mostrarMensajeBienvenida() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message bot-message';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const stats = document.createElement('div');
            stats.className = 'properties-stats';
            stats.innerHTML = `
                <strong>📊 Estadísticas del Sistema:</strong><br>
                • Total de propiedades: <strong>${propiedadesDisponibles}</strong><br>
                • Tipos disponibles: <strong>${tiposDisponibles.length}</strong><br>
                • Barrios disponibles: <strong>${[...new Set(propiedades.map(p => p.barrio))].length}</strong>
            `;
            
            const navigationHint = document.createElement('div');
            navigationHint.className = 'navigation-hint';
            navigationHint.innerHTML = `
                <strong>🧭 Navegación:</strong><br>
                • Usa números <strong>1, 2, 3</strong> para navegar<br>
                • Usa <strong>0</strong> para volver atrás<br>
                • Presiona <strong>Enter</strong> para confirmar
            `;
            
            content.appendChild(stats);
            content.appendChild(navigationHint);
            welcomeDiv.appendChild(content);
            chatMessages.appendChild(welcomeDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Función para mostrar error de carga
        function mostrarErrorCarga(error) {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot-message';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const errorMsg = document.createElement('div');
            errorMsg.className = 'error-message';
            errorMsg.innerHTML = `
                <strong>❌ Error al cargar propiedades</strong><br>
                ${error.message}<br><br>
                <strong>Posibles soluciones:</strong><br>
                • Verifica que <code>propiedades.json</code> exista<br>
                • Si usas <code>file://</code>, algunos navegadores bloquean archivos externos<br>
                • Usa un servidor local (ej: <code>python -m http.server 9000</code>)
            `;
            
            content.appendChild(errorMsg);
            errorDiv.appendChild(content);
            chatMessages.appendChild(errorDiv);
            
            actualizarDebug(`❌ Error: ${error.message}`);
        }

        // Función para actualizar debug info
        function actualizarDebug(mensaje) {
            console.log(`🔍 [DEBUG]: ${mensaje}`);
            
            let debugDiv = document.getElementById('debugInfo');
            if (!debugDiv) {
                debugDiv = document.createElement('div');
                debugDiv.id = 'debugInfo';
                debugDiv.className = 'debug-info';
                document.body.appendChild(debugDiv);
            }
            debugDiv.textContent = mensaje;
        }

        // Inicializar cuando la página cargue
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página cargada, iniciando sistema...');
            actualizarDebug("🚀 Iniciando sistema...");
            inicializarSistema();
        });
    </script>
</body>
</html>
