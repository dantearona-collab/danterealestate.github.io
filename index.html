<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Sistema Inmoviliario</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Estilos básicos del modal */
        .modal-imagenes {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-contenido {
            position: relative;
            margin: 2% auto;
            width: 90%;
            max-width: 1000px;
            height: 90%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .imagen-principal {
            width: 100%;
            height: 80%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #000;
        }
        .modal-header {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
        }
        .btn-cerrar {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cerrar:hover {
            background: rgba(0,0,0,0.9);
        }
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .nav-anterior {
            left: 10px;
        }
        .nav-siguiente {
            right: 10px;
        }
        .miniaturas-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            max-width: 80%;
            overflow-x: auto;
        }
        .miniatura {
            width: 60px;
            height: 40px;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .miniatura:hover {
            border-color: #25d366;
        }
        .miniatura.active {
            border-color: #25d366;
            border-width: 3px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🏡 Dante Propiedades</h1>
                    <p>Inmobiliaria Profesional</p>
                </div>
                <nav class="nav">
                    <a href="#inicio">Inicio</a>
                    <a href="#propiedades">Propiedades</a>
                    <a href="#servicios">Servicios</a>
                    <a href="#contacto">Contacto</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Filtros principales -->
    <section class="filters-section" id="filtros">
        <div class="container">
            <h2>🏠 Encuentra tu propiedad ideal</h2>
            <div class="filters-container">
                <div class="filter-group">
                    <label for="operacion-select-styled">Operación</label>
                    <select id="operacion-select-styled" class="filter-input">
                        <option value="">Todas las operaciones</option>
                        <option value="Venta">Venta</option>
                        <option value="Alquiler">Alquiler</option>
                        <option value="Desarrollo">Desarrollo</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="barrio-select-styled">Barrio</label>
                    <select id="barrio-select-styled" class="filter-input">
                        <option value="">Todos los barrios</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="tipo-select-styled">Tipo de Propiedad</label>
                    <select id="tipo-select-styled" class="filter-input">
                        <option value="">Todos los tipos</option>
                        <option value="Casa">Casa</option>
                        <option value="Departamento">Departamento</option>
                        <option value="Terreno">Terreno</option>
                        <option value="Oficina">Oficina</option>
                    </select>
                </div>
                
                <button id="search-btn-styled" class="search-btn">🔍 Buscar</button>
                <button id="clear-filters-styled" class="clear-btn">🗑️ Limpiar</button>
            </div>
        </div>
    </section>

    <!-- Sección de propiedades -->
    <section class="properties-section" id="propiedades">
        <div class="container">
            <h2>Propiedades disponibles</h2>
            <div id="properties-container" class="properties-grid">
                <!-- Las propiedades se cargarán aquí dinámicamente -->
            </div>
            <div id="no-results" class="no-results" style="display: none;">
                <h3>🔍 No se encontraron propiedades</h3>
                <p>Intenta ajustar los filtros de búsqueda</p>
            </div>
        </div>
    </section>

    <!-- Formulario de contacto -->
    <section class="contact-section" id="contacto">
        <div class="container">
            <h2>📞 Contactanos</h2>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">📧 Enviar consulta</button>
            </form>
        </div>
    </section>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/5491125368595" class="whatsapp-btn" target="_blank">

    <script>
        console.log('🏠 Sistema Dante Propiedades - VERSIÓN UNIFICADA cargando...');
        console.log('✅ Todo el JavaScript embebido en un solo archivo');
        console.log('🎠 Slider de múltiples fotos incluido');
        console.log('📋 Formulario de contacto integrado');
        console.log('🔧 Sin dependencias de archivos externos');

        // Variables globales
        let globalData = null;
        let sampleData = [];
        let currentSlides = {};

        // Variables del modal
        let propiedadActual = null;
        let imagenesModal = [];
        let imagenActual = 0;

        // Datos de propiedades
        const propiedades = {

                {

                    "fotos": [

                    "descripcion": "Moderno departamento de 2 ambientes en edificio premium.",
                    "fotos": [
                        "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800",

                        "https://images.unsplash.com/photo-1560448204-666cb6ef0e2d?w=800",
                        "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800",
                        "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=800",

                {

                    "barrio": "Microcentro",
                    "precio": "USD 2,500/mes",
                    "descripcion": "Oficina comercial en el corazón del microcentro. Perfecto para oficinas corporativas.",
                    "fotos": [
                        "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800",

                        "https://images.unsplash.com/photo-1497366651664-3c7206be5c2a?w=800"
                    ],
                    "info_multimedia": "3 fotos disponibles"
                }
            ]
        };

        // Función para crear el slider de imágenes
        function createImageSlider(property) {
            const fotos = property.fotos || [];
            
            if (fotos.length === 0) {
                return `
                    <div style="position: relative;">
                        <img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800" 
                             alt="${property.titulo}" 
                             style="width: 100% !important; height: 200px !important; object-fit: cover !important;"
                             onerror="this.src='https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=800'">
                `;
            }
            
            if (fotos.length === 1) {
                return `
                    <div style="position: relative;">
                        <img src="${fotos[0]}" 
                             alt="${property.titulo}" 
                             style="width: 100% !important; height: 200px !important; object-fit: cover !important;"
                             onerror="this.src='https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=800'">
                `;
            }
            
            const imageSlides = fotos.map((foto, index) => `
                <div class="property-slide ${index === 0 ? 'active' : ''}" data-slide="${index}">
                    <img src="${foto}" 
                         alt="${property.titulo} - Foto ${index + 1}" 
                         style="width: 100% !important; height: 200px !important; object-fit: cover !important;"
                         onerror="this.src='INSTITUCIONAL 3.png'">
                </div>
            `).join('');
            
            const navigationDots = fotos.map((_, index) => `
                <span class="property-nav-dot ${index === 0 ? 'active' : ''}" onclick="showSlide('${property.id_temporal}', ${index})"></span>
            `).join('');
            
            return `
                <div style="position: relative;">
                    <div class="property-slider" id="slider-${property.id_temporal}">
                        ${imageSlides}
                    </div>
                    <button class="property-slider-btn property-slider-prev" onclick="previousSlide('${property.id_temporal}')" style="position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; cursor: pointer;">❮</button>
                    <button class="property-slider-btn property-slider-next" onclick="nextSlide('${property.id_temporal}')" style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; cursor: pointer;">❯</button>
                    <button class="property-expand-btn" onclick="abrirModalImagenesComplete('${property.id_temporal}')" style="position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.7); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 11; display: flex; align-items: center; justify-content: center;">🔍</button>
                    <div class="property-slider-nav">
                        ${navigationDots}
                    </div>
                </div>
            `;
        }

        // Funciones del slider
        function nextSlide(propertyId) {
            if (!currentSlides[propertyId]) currentSlides[propertyId] = 0;
            currentSlides[propertyId] = (currentSlides[propertyId] + 1) % (globalData.properties.find(p => p.id_temporal === propertyId)?.fotos.length || 1);
            updateSlider(propertyId);
        }

        function previousSlide(propertyId) {
            if (!currentSlides[propertyId]) currentSlides[propertyId] = 0;
            const totalSlides = globalData.properties.find(p => p.id_temporal === propertyId)?.fotos.length || 1;
            currentSlides[propertyId] = (currentSlides[propertyId] - 1 + totalSlides) % totalSlides;
            updateSlider(propertyId);
        }

        function showSlide(propertyId, slideIndex) {
            currentSlides[propertyId] = slideIndex;
            updateSlider(propertyId);
        }

        function updateSlider(propertyId) {
            const slides = document.querySelectorAll(`#slider-${propertyId} .property-slide`);
            const dots = document.querySelectorAll(`#slider-${propertyId} ~ .property-slider-nav .property-nav-dot`);
            
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlides[propertyId]);
            });
            
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlides[propertyId]);
            });
        }

        // Función para renderizar propiedades
        function renderProperties(properties) {
            const container = document.getElementById('properties-container');
            const noResults = document.getElementById('no-results');
            
            if (properties.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            container.innerHTML = properties.map(property => `
                <div class="property-card" data-property-id="${property.id_temporal}">
                    ${createImageSlider(property)}
                    <div class="property-info">
                        <h3>${property.titulo}</h3>
                        <p class="property-location">📍 ${property.barrio}</p>
                        <p class="property-type">${property.tipo} • ${property.operacion}</p>
                        <p class="property-price">${property.precio}</p>
                        <p class="property-description">${property.descripcion}</p>
                        <div style="display: flex !important; gap: 10px !important; margin-bottom: 15px !important;">
                            <button onclick="abrirModalImagenesComplete('${property.id_temporal}')" 
                                    style="flex: 1 !important; background: #25d366 !important; color: white !important; 
                                           border: none !important; padding: 10px !important; border-radius: 6px !important;
                                           cursor: pointer !important; font-weight: bold !important;">
                                🖼️ Ver Imágenes
                            </button>
                            <button onclick="mostrarDetalles('${property.id_temporal}')" 
                                    style="flex: 1 !important; background: #007bff !important; color: white !important; 
                                           border: none !important; padding: 10px !important; border-radius: 6px !important;
                                           cursor: pointer !important;">
                                📞 Consultar
                            </button>
                        </div>
                        <span style="background: #e9ecef; color: #495057; padding: 5px 10px; border-radius: 4px; font-size: 12px;">
                            ${property.info_multimedia || 'Fotos disponibles'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Función para filtrar propiedades
        function filterProperties() {
            const operacion = document.getElementById('operacion-select-styled').value;
            const barrio = document.getElementById('barrio-select-styled').value;
            const tipo = document.getElementById('tipo-select-styled').value;
            
            const filtered = globalData.properties.filter(property => {
                return (!operacion || property.operacion === operacion) &&
                       (!barrio || property.barrio === barrio) &&
                       (!tipo || property.tipo === tipo);
            });
            
            console.log('🔍 Propiedades filtradas:', filtered.length);
            renderProperties(filtered);
        }

        // Función para limpiar filtros
        function clearFilters() {
            document.getElementById('operacion-select-styled').value = '';
            document.getElementById('barrio-select-styled').value = '';
            document.getElementById('tipo-select-styled').value = '';
            renderProperties(globalData.properties);
        }

        // Función para mostrar detalles
        function mostrarDetalles(propertyId) {
            const property = globalData.properties.find(p => p.id_temporal === propertyId);
            if (property) {
                const mensaje = `Hola! Me interesa la propiedad: ${property.titulo} en ${property.barrio} - ${property.precio}`;
                window.open(`https://wa.me/5491125368595?text=${encodeURIComponent(mensaje)}`, '_blank');
            }
        }

        // FUNCIONES DEL MODAL DE IMÁGENES
        function abrirModalImagenes(propiedad) {
            try {
                console.log('📸 Abriendo modal para:', propiedad.titulo);
                
                if (!propiedad.fotos || propiedad.fotos.length === 0) {
                    alert('Esta propiedad no tiene imágenes disponibles.');
                    return;
                }
                
                propiedadActual = propiedad;
                imagenesModal = propiedad.fotos;
                imagenActual = 0;
                
                document.getElementById('modal-imagenes').style.display = 'block';
                mostrarImagenActual();
                document.addEventListener('keydown', manejarTecladoModal);
                
            } catch (error) {
                console.error('❌ Error al abrir modal:', error);
                alert('Error al abrir el modal de imágenes.');
            }
        }

        function abrirModalImagenesComplete(propertyId) {
            try {
                console.log('📸 Iniciando apertura de modal para propiedad:', propertyId);
                
                const property = globalData.properties.find(p => p.id_temporal === propertyId);
                
                if (!property) {
                    console.error('❌ No se encontró la propiedad:', propertyId);
                    alert('Error: No se pudo encontrar la información de la propiedad.');
                    return;
                }
                
                if (!property.fotos || property.fotos.length === 0) {
                    console.warn('⚠️ La propiedad no tiene imágenes:', propertyId);
                    alert('Esta propiedad no tiene imágenes disponibles.');
                    return;
                }
                
                console.log('✅ Propiedad encontrada:', property.titulo, 'con', property.fotos.length, 'imágenes');
                
                if (typeof abrirModalImagenes === 'function') {
                    abrirModalImagenes(property);
                } else {
                    console.error('❌ Función abrirModalImagenes no encontrada');
                    alert('Error: Sistema de imágenes no disponible.');
                }
                
            } catch (error) {
                console.error('❌ Error al abrir modal de imágenes:', error);
                alert('Error al abrir la visualización de imágenes. Por favor, inténtelo nuevamente.');
            }
        }

        function cerrarModalImagenes() {
            document.getElementById('modal-imagenes').style.display = 'none';
            document.removeEventListener('keydown', manejarTecladoModal);
        }

        function mostrarImagenActual() {
            if (imagenActual >= 0 && imagenActual < imagenesModal.length) {
                const imagen = imagenesModal[imagenActual];
                document.getElementById('imagen-principal').style.backgroundImage = `url('${imagen}')`;
            }
        }

        function imagenAnterior() {
            if (imagenActual > 0) {
                imagenActual--;
                mostrarImagenActual();
            }
        }

        function imagenSiguiente() {
            if (imagenActual < imagenesModal.length - 1) {
                imagenActual++;
                mostrarImagenActual();
            }
        }

        function manejarTecladoModal(event) {
            if (event.key === 'Escape') {
                cerrarModalImagenes();
            } else if (event.key === 'ArrowLeft') {
                imagenAnterior();
            } else if (event.key === 'ArrowRight') {
                imagenSiguiente();
            }
        }

        // Función para cargar datos
        function loadData() {
            console.log('📂 Cargando datos de propiedades...');
            globalData = propiedades;
            sampleData = propiedades.properties;
            
            populateFilters();
            renderProperties(globalData.properties);
            
            console.log('✅ Datos cargados:', globalData.properties.length, 'propiedades');
        }

        function populateFilters() {
            const barrios = [...new Set(globalData.properties.map(p => p.barrio))];
            const tipos = [...new Set(globalData.properties.map(p => p.tipo))];
            
            const barrioSelect = document.getElementById('barrio-select-styled');
            const tipoSelect = document.getElementById('tipo-select-styled');
            
            barrioSelect.innerHTML = '<option value="">Todos los barrios</option>' + 
                barrios.map(barrio => `<option value="${barrio}">${barrio}</option>`).join('');
            
            tipoSelect.innerHTML = '<option value="">Todos los tipos</option>' + 
                tipos.map(tipo => `<option value="${tipo}">${tipo}</option>`).join('');
            
            console.log('🔧 Filtros poblados - Barrios:', barrios.length, 'Tipos:', tipos.length);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Sistema inicializando...');
            
            // Cargar datos
            loadData();
            
            // Event listeners
            document.getElementById('search-btn-styled').addEventListener('click', filterProperties);
            document.getElementById('clear-filters-styled').addEventListener('click', clearFilters);
            
            // Cerrar modal con clic fuera
            document.getElementById('modal-imagenes').addEventListener('click', function(e) {
                if (e.target === this) {
                    cerrarModalImagenes();
                }
            });
            
            console.log('✅ Sistema inicializado sin errores');
        });

        console.log('🎠 Slider de múltiples fotos disponible');
        console.log('📋 Formulario de contacto listo');
        console.log('🖼️ Sistema de modal integrado');
    </script>

    <!-- Modal de Imágenes -->
    <div id="modal-imagenes" class="modal-imagenes">
        <div class="modal-contenido">
            <div class="modal-header">
                <button class="btn-cerrar" onclick="cerrarModalImagenes()">&times;</button>
            </div>
            
            <div id="imagen-principal" class="imagen-principal"></div>
            
            <button class="modal-nav nav-anterior" onclick="imagenAnterior()">&#10094;</button>
            <button class="modal-nav nav-siguiente" onclick="imagenSiguiente()">&#10095;</button>
            
            <div class="miniaturas-container" id="miniaturas"></div>
        </div>
    </div>
</body>
</html>
