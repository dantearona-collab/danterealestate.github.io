<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante Propiedades - Galería con Múltiples Imágenes</title>
    <link rel="icon" href="/llave.png" type="image/png">
    
    <style>
        /* RESET Y BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        
        /* HEADER */
        .header {
            background: linear-gradient(135deg, #232deb 0%, #1a1db4 100%);
            color: white;
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(35, 45, 235, 0.3);
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .header .company-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header .phone {
            font-size: 0.4em;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .header .logo-key {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .header .logo-key img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* SECCIÓN DE PROPIEDADES */
        .properties-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .properties-section h2 {
            color: #232deb;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        /* GRID DE PROPIEDADES */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .property-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .property-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border-color: #232deb;
        }
        
        /* IMAGEN PRINCIPAL */
        .property-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        
        /* CONTENIDO DE LA TARJETA */
        .property-content {
            padding: 25px;
        }
        
        .property-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        
        .property-price {
            font-size: 1.8em;
            font-weight: 800;
            color: #232deb;
            margin-bottom: 15px;
        }
        
        .property-details {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .property-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9em;
        }
        
        .property-detail svg {
            width: 16px;
            height: 16px;
            color: #232deb;
        }
        
        /* BOTÓN 360° */
        .btn-360 {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-360:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-360:active {
            transform: translateY(0);
        }
        
        .btn-360 .icon {
            font-size: 1.2em;
        }
        
        /* WHATSAPP FLOTANTE */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
        }
        
        .whatsapp-float svg {
            width: 28px;
            height: 28px;
            fill: white;
        }
        
        /* MODAL 360° */
        .modal-360 {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }
        
        .modal-content-360 {
            position: relative;
            background-color: #fefefe;
            margin: 2% auto;
            padding: 0;
            border-radius: 15px;
            width: 95%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header-360 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header-360 h2 {
            margin: 0;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .close-360 {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        
        .close-360:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* GALERÍA DE IMÁGENES */
        .image-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            background: #f8f9fa;
        }
        
        .main-image-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .main-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }
        
        .image-navigation {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .image-navigation:hover {
            background: rgba(0,0,0,0.7);
        }
        
        .image-navigation.prev {
            left: 15px;
        }
        
        .image-navigation.next {
            right: 15px;
        }
        
        .image-thumbnails {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 100%;
            overflow-x: auto;
            padding: 10px 0;
        }
        
        .thumbnail {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.7;
        }
        
        .thumbnail:hover, .thumbnail.active {
            opacity: 1;
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .properties-section {
                padding: 25px;
            }
            
            .properties-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .modal-content-360 {
                width: 98%;
                margin: 1% auto;
                max-height: 95vh;
            }
            
            .main-image {
                height: 300px;
            }
        }
        
        /* LOADING */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <h1>
            <div class="company-info">
                <div class="logo-key">
                    <img src="/llave.png" alt="Dante Propiedades">
                </div>
                <span>Dante Propiedades</span>
            </div>
        </h1>
        <div class="phone">📞 +54 11 4567-8900</div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <div class="properties-section">
            <h2>🏠 Propiedades en Venta</h2>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Cargando propiedades...</p>
            </div>
            
            <div class="properties-grid" id="propertiesGrid">
                <!-- Las propiedades se cargarán aquí dinámicamente -->
            </div>
        </div>
    </div>

    <!-- MODAL 360° -->
    <div id="modal360" class="modal-360">
        <div class="modal-content-360">
            <div class="modal-header-360">
                <h2><span class="icon">🎬</span> Galería 360°</h2>
                <span class="close-360" onclick="cerrarModal360()">&times;</span>
            </div>
            <div class="image-gallery">
                <div class="main-image-container">
                    <img id="mainImage" class="main-image" src="" alt="Imagen principal">
                    <button class="image-navigation prev" onclick="cambiarImagen(-1)">❮</button>
                    <button class="image-navigation next" onclick="cambiarImagen(1)">❯</button>
                </div>
                <div class="image-thumbnails" id="imageThumbnails">
                    <!-- Miniaturas se generarán dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- WHATSAPP FLOTANTE -->
    <a href="https://wa.me/5491145678900?text=Hola,%20me%20interesa%20obtener%20más%20información%20sobre%20sus%20propiedades" 
       class="whatsapp-float" target="_blank" title="Contactar por WhatsApp">
        <svg viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.097"/>
        </svg>
    </a>

    <script>
        console.log('🏠 === SISTEMA DANTEPROPIEDADES 360° CARGADO ===');
        console.log('✅ Sin bucles infinitos - Sistema limpio y funcional');

        // Datos de propiedades
        const propiedadesData = [
            {
                id: 1,
                titulo: "Departamento Moderno en Palermo",
                precio: "$250,000",
                ubicacion: "Palermo, Buenos Aires",
                habitaciones: 3,
                banos: 2,
                superficie: "120 m²",
                imagenes: [
                    "https://picsum.photos/600/400?random=1",
                    "https://picsum.photos/600/400?random=2", 
                    "https://picsum.photos/600/400?random=3",
                    "https://picsum.photos/600/400?random=4",
                    "https://picsum.photos/600/400?random=5"
                ]
            },
            {
                id: 2,
                titulo: "Casa con Jardín en Belgrano",
                precio: "$380,000",
                ubicacion: "Belgrano, Buenos Aires",
                habitaciones: 4,
                banos: 3,
                superficie: "180 m²",
                imagenes: [
                    "https://picsum.photos/600/400?random=6",
                    "https://picsum.photos/600/400?random=7",
                    "https://picsum.photos/600/400?random=8",
                    "https://picsum.photos/600/400?random=9"
                ]
            },
            {
                id: 3,
                titulo: "Oficina Comercial en Microcentro",
                precio: "$150,000",
                ubicacion: "Microcentro, Buenos Aires",
                habitaciones: 0,
                banos: 1,
                superficie: "80 m²",
                imagenes: [
                    "https://picsum.photos/600/400?random=10",
                    "https://picsum.photos/600/400?random=11",
                    "https://picsum.photos/600/400?random=12"
                ]
            },
            {
                id: 4,
                titulo: "Departamento de Lujo en Puerto Madero",
                precio: "$520,000",
                ubicacion: "Puerto Madero, Buenos Aires",
                habitaciones: 2,
                banos: 2,
                superficie: "95 m²",
                imagenes: [
                    "https://picsum.photos/600/400?random=13",
                    "https://picsum.photos/600/400?random=14",
                    "https://picsum.photos/600/400?random=15",
                    "https://picsum.photos/600/400?random=16",
                    "https://picsum.photos/600/400?random=17",
                    "https://picsum.photos/600/400?random=18"
                ]
            }
        ];

        // Variables para el modal
        let propiedadActual = null;
        let imagenActual = 0;

        // Función para crear tarjetas de propiedades
        function crearTarjetasPropiedades() {
            console.log('🏗️ Creando tarjetas de propiedades...');
            
            const grid = document.getElementById('propertiesGrid');
            const loading = document.getElementById('loading');
            
            if (!grid) {
                console.error('❌ No se encontró el elemento #propertiesGrid');
                return;
            }
            
            // Mostrar loading
            if (loading) {
                loading.style.display = 'block';
            }
            grid.style.display = 'none';
            
            // Simular carga
            setTimeout(() => {
                if (loading) {
                    loading.style.display = 'none';
                }
                grid.style.display = 'grid';
                
                // Limpiar grid existente
                grid.innerHTML = '';
                
                propiedadesData.forEach((propiedad, index) => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'property-card';
                    tarjeta.innerHTML = `
                        <img src="${propiedad.imagenes[0]}" alt="${propiedad.titulo}" class="property-image">
                        <div class="property-content">
                            <h3 class="property-title">${propiedad.titulo}</h3>
                            <div class="property-price">${propiedad.precio}</div>
                            <div class="property-details">
                                <div class="property-detail">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                                    </svg>
                                    ${propiedad.ubicacion}
                                </div>
                                ${propiedad.habitaciones > 0 ? `
                                    <div class="property-detail">
                                        <svg viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                        </svg>
                                        ${propiedad.habitaciones} hab.
                                    </div>
                                ` : ''}
                                <div class="property-detail">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2c1.1 0 2 .9 2 2v2h4V4c0-1.1-.9-2-2-2h-4v4h6V4zM8 10v8H4v-8h4zm6-8h4v6h-4V2zm4 12v8h-4v-8h4zm6-10v18h-4V4h4z"/>
                                    </svg>
                                    ${propiedad.banos} baño${propiedad.banos > 1 ? 's' : ''}
                                </div>
                                <div class="property-detail">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                                    </svg>
                                    ${propiedad.superficie}
                                </div>
                            </div>
                            <button class="btn-360" onclick="abrirModal360(${index})">
                                <span class="icon">🎬</span>
                                Ver Recorrido 360°
                            </button>
                        </div>
                    `;
                    grid.appendChild(tarjeta);
                });
                
                console.log(`✅ ${propiedadesData.length} propiedades cargadas exitosamente`);
            }, 800);
        }

        // Función para abrir modal 360°
        function abrirModal360(indice) {
            console.log(`🎬 Abriendo galería 360° para: ${propiedadesData[indice].titulo}`);
            
            if (indice < 0 || indice >= propiedadesData.length) {
                console.error('❌ Índice de propiedad inválido:', indice);
                return;
            }
            
            propiedadActual = propiedadesData[indice];
            imagenActual = 0;
            
            // Mostrar modal
            const modal = document.getElementById('modal360');
            if (!modal) {
                console.error('❌ No se encontró el modal con id "modal360"');
                return;
            }
            
            modal.style.display = 'block';
            
            // Actualizar contenido
            actualizarImagenesModal();
            
            // Añadir clase para animación
            setTimeout(() => {
                modal.style.opacity = '1';
            }, 10);
        }

        // Función para cerrar modal
        function cerrarModal360() {
            const modal = document.getElementById('modal360');
            if (!modal) return;
            
            modal.style.opacity = '0';
            
            setTimeout(() => {
                modal.style.display = 'none';
                propiedadActual = null;
                imagenActual = 0;
            }, 300);
        }

        // Función para actualizar imágenes del modal
        function actualizarImagenesModal() {
            if (!propiedadActual) {
                console.warn('⚠️ No hay propiedad actual seleccionada');
                return;
            }
            
            const mainImage = document.getElementById('mainImage');
            const thumbnailsContainer = document.getElementById('imageThumbnails');
            
            if (!mainImage || !thumbnailsContainer) {
                console.error('❌ No se encontraron elementos del modal');
                return;
            }
            
            // Actualizar imagen principal
            mainImage.src = propiedadActual.imagenes[imagenActual];
            mainImage.alt = `${propiedadActual.titulo} - Imagen ${imagenActual + 1}`;
            
            // Crear/actualizar miniaturas
            thumbnailsContainer.innerHTML = '';
            propiedadActual.imagenes.forEach((imagen, index) => {
                const thumbnail = document.createElement('img');
                thumbnail.src = imagen;
                thumbnail.alt = `Miniatura ${index + 1}`;
                thumbnail.className = `thumbnail ${index === imagenActual ? 'active' : ''}`;
                thumbnail.onclick = () => cambiarAImagen(index);
                thumbnailsContainer.appendChild(thumbnail);
            });
            
            // Actualizar navegación
            const prevBtn = document.querySelector('.image-navigation.prev');
            const nextBtn = document.querySelector('.image-navigation.next');
            
            if (prevBtn) {
                prevBtn.style.display = imagenActual > 0 ? 'flex' : 'none';
            }
            if (nextBtn) {
                nextBtn.style.display = imagenActual < propiedadActual.imagenes.length - 1 ? 'flex' : 'none';
            }
        }

        // Función para cambiar imagen
        function cambiarImagen(direccion) {
            if (!propiedadActual) {
                console.warn('⚠️ No hay propiedad actual');
                return;
            }
            
            const nuevaImagen = imagenActual + direccion;
            if (nuevaImagen >= 0 && nuevaImagen < propiedadActual.imagenes.length) {
                imagenActual = nuevaImagen;
                actualizarImagenesModal();
            }
        }

        // Función para cambiar a imagen específica
        function cambiarAImagen(indice) {
            if (!propiedadActual) {
                console.warn('⚠️ No hay propiedad actual');
                return;
            }
            
            if (indice >= 0 && indice < propiedadActual.imagenes.length) {
                imagenActual = indice;
                actualizarImagenesModal();
            }
        }

        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarModal360();
            }
        });
        
        const modal = document.getElementById('modal360');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    cerrarModal360();
                }
            });
