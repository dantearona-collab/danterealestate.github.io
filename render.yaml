services:
  - type: web
    name: dante-propiedades
    env: python
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main_ai:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WORKING_MODEL
        value: gemini-3.6-flash