services:
  - type: web
    name: dante-propiedades
    env: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_ai:app --host 0.0.0.0 --port $PORT
    envVars: []

    WORKING_MODEL: gemini-2.0-flash-001